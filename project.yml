name: Forma
options:
  bundleIdPrefix: org.appartiene
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM: <Team ID Apple Developer>   (oppure sceglilo in Xcode > Signing & Capabilities)
targets:
  Forma:
    type: application
    platform: iOS
    sources: [Forma]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.appartiene.forma
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Forma/Forma.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Forma/Info.plist
      properties:
        CFBundleDisplayName: Forma
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "Forma legge la frequenza cardiaca e gli allenamenti registrati dall'Apple Watch per mostrarli al tuo allenatore dopo la sessione."
        ITSAppUsesNonExemptEncryption: false
